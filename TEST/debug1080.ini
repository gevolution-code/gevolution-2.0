#!/bin/bash
#SBATCH --partition=debug
#SBATCH --account=lp165
#SBATCH --nodes=1
#SBATCH --ntasks-per-node=4
#SBATCH --cpus-per-task=72
#SBATCH --gpus-per-node=4
#SBATCH --gpus-per-task=1
#SBATCH --time=00:15:00

# tasks: $SLURM_NTASKS
# tasks-per-node: $SLURM_NTASKS_PER_NODE

# either master or a100
worker="a100new_unpatched"
N=128
uenv start --view=modules prgenv-gnu/25.6:v2
source ~/modules_gpu2
module list
gpath="/users/christia/Projects/gasgrd/gasgrd/settings/"
exepath="/users/christia/Projects/GPU/"$worker
runfld="/capstor/scratch/cscs/christia/run"$worker
outfld="/capstor/scratch/cscs/christia/output/N"${N}"/"$worker
export OMP_PLACES=cores
export FI_CXI_RX_MATCH_MODE=hybrid
export FI_CXI_RDZV_THRESHOLD=2097152
export FI_CXI_REQ_BUF_SIZE=4194304
export FI_CXI_REQ_BUF_MIN_POSTED=64
export FI_CXI_REQ_BUF_MAX_CACHED=256

mkdir -p $runfld
rm -rf $runfld/*
cp -r $exepath/* $runfld
# cp settings_N${N}_${worker}.ini $runfld/_used_settings.ini
# cp ${gpath}/lcdm.ini $runfld/_used_settings.ini
cp /users/christia/Projects/GPU/lcdm.ini $runfld/_used_settings.ini
cp gpu-bind.sh $runfld
cd $runfld
rm -rf $outfld
mkdir -p $outfld

# GH has 72 ARM cores, 4 GH/node
export OMP_NUM_THREADS=$SLURM_CPUS_PER_TASK
#srun --hint=exclusive --cpu-bind=socket -n $SLURM_NTASKS ./jobreport -o report1080${worker} -- ./gevolution -n 2 -m 2 -s settings.ini
echo "Running with "$SLURM_NTASKS "tasks, each with" $SLURM_CPUS_PER_TASK "CPUs and 1 GPU"
srun -n $SLURM_NTASKS --hint=exclusive --cpu-bind=socket ./gpu-bind.sh ./nsys_wrapper.sh ./gevolution -n 2 -m 2 -s _used_settings.ini
echo "Done"
